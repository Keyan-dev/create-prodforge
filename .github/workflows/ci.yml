name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test the built CLI
        run: |
          test "$(node dist/index.js --version)" = "$(node -p 'require("./package.json").version')"
          cd "$RUNNER_TEMP" && node "$GITHUB_WORKSPACE/dist/index.js" smoke-app --yes --no-install --no-git
          test -f smoke-app/src/app.ts && test -f smoke-app/.gitignore

  e2e:
    # Generate → install → lint/test/build/run for real (PLAN.md §6), one job per database.
    name: e2e (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [prisma, drizzle, mongoose, none]
    env:
      PRODFORGE_E2E_DB: ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Git identity for the generated project's initial commit
        run: |
          git config --global user.name "create-prodforge CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: pnpm test:e2e
