name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test the packed CLI
        run: scripts/smoke-pack.sh

  e2e:
    # Generate → install → lint/test/build/run for real (PLAN.md §6): every framework × database
    # with ESLint, plus Biome and the add-ons (extra flags) on a few of them. One job per case.
    name: e2e (${{ matrix.framework }}, ${{ matrix.db }}, ${{ matrix.lint }}${{ matrix.extra && format(', {0}', matrix.extra) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [express, fastify, hono]
        db: [prisma, drizzle, mongoose, none]
        lint: [eslint]
        extra: ['']
        include:
          - { framework: express, db: mongoose, lint: biome, extra: '' }
          - { framework: hono, db: drizzle, lint: biome, extra: '' }
          - { framework: express, db: prisma, lint: eslint, extra: '--cache bullmq --otel' }
          - { framework: fastify, db: mongoose, lint: eslint, extra: '--cache redis --otel' }
          - { framework: hono, db: drizzle, lint: biome, extra: '--cache bullmq' }
          - { framework: express, db: prisma, lint: eslint, extra: '--auth jwt' }
          - { framework: hono, db: mongoose, lint: eslint, extra: '--auth jwt' }
          - { framework: fastify, db: drizzle, lint: eslint, extra: '--auth better-auth' }
          - { framework: express, db: mongoose, lint: biome, extra: '--auth better-auth' }
          - { framework: hono, db: prisma, lint: eslint, extra: '--auth better-auth' }
          - { framework: express, db: prisma, lint: eslint, extra: '--preset full' }
          - { framework: express, db: none, lint: eslint, extra: '--preset minimal' }
    env:
      PRODFORGE_E2E_FRAMEWORK: ${{ matrix.framework }}
      PRODFORGE_E2E_DB: ${{ matrix.db }}
      PRODFORGE_E2E_LINT: ${{ matrix.lint }}
      PRODFORGE_E2E_FLAGS: ${{ matrix.extra }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Git identity for the generated project's initial commit
        run: |
          git config --global user.name "create-prodforge CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: pnpm test:e2e
