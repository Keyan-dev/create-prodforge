name: Publish

# Run by hand from the Actions tab after merging the "Version Packages" PR. It checks, packs and
# smoke-tests the CLI, then publishes the version in package.json to npm with provenance and
# pushes its git tag. Needs an NPM_TOKEN secret (an npm automation or granular token), or npm
# trusted publishing configured for this workflow.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and check everything, but don't publish
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build
      - run: scripts/smoke-pack.sh
      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Push the release tag
        if: ${{ !inputs.dry-run }}
        run: git push --follow-tags
